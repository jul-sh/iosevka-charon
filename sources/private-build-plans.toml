[buildPlans.IosevkaCharon]
family = "Iosevka Charon"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
exportGlyphNames = true
buildTextureFeature = true
noLigation = false

[buildPlans.IosevkaCharon.ligations]
enables = ["kern-bars", "kern-dotty"]

[buildPlans.IosevkaCharon.variants]
inherits = "ss08"

[buildPlans.IosevkaCharon.variants.design]
two = "straight-neck-serifless"
three = "two-arcs"
five = "oblique-flat-serifless"
six = "open-contour"
eight = "crossing"
nine = "open-contour"
zero = "oval-slashed"
capital-q = "crossing"
capital-a = "curly-serifless"
capital-v = "curly-serifless"
capital-w = "curly-asymmetric-serifless"
capital-y = "curly-serifless"
w = "curly-almost-flat-top-serifless"
d = "tailed-serifless"
e = "rounded"
i = "serifed-flat-tailed"
j = "narrow-serifed"
l = "serifed-flat-tailed"
u = "tailed-serifless"
v = "curly-serifless"
y = "curly-turn-serifless"
ampersand = "closed"
at = "fourfold"
f = "narrow-serifless"
t = "narrow-bent-hook"
r = "narrow-hook-serifless"
dollar = "through"
ellipsis-density = "dense"

# one width
[buildPlans.IosevkaCharon.widths.Normal]
shape = 500
menu = 5
css = "normal"

# Light, Regular, Medium, Bold, Heavy weights
[buildPlans.IosevkaCharon.weights.Light]
shape = 300
menu = 300
css  = 300

[buildPlans.IosevkaCharon.weights.Regular]
shape = 400
menu = 400
css  = 400

[buildPlans.IosevkaCharon.weights.Medium]
shape = 500
menu = 500
css  = 500

[buildPlans.IosevkaCharon.weights.Bold]
shape = 700
menu = 700
css  = 700

# ONLY Upright and Italic slopes
[buildPlans.IosevkaCharon.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css  = "normal"

[buildPlans.IosevkaCharon.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css  = "italic"

