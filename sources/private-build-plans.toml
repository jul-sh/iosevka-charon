# ------------------------------------------------------------------
# Iosevka Caleuche: Iosevka Charon re-proportioned to pair with Kerberos
# (https://github.com/jul-sh/Kerberos). Same letterforms as Charon; Kerberos's
# vertical zones, a matching narrower width, a steeper italic, and weights
# set by eye against Kerberos.

[buildPlans.IosevkaCaleuche]
family = "Iosevka Caleuche"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
exportGlyphNames = true
buildTextureFeature = true
noLigation = false

[buildPlans.IosevkaCaleuche.ligations]
enables = ["kern-bars", "kern-dotty"]

[buildPlans.IosevkaCaleuche.variants]
inherits = "ss08"

[buildPlans.IosevkaCaleuche.variants.design]
two = "straight-neck-serifless"
three = "two-arcs"
five = "oblique-flat-serifless"
six = "open-contour"
eight = "crossing"
nine = "open-contour"
zero = "oval-slashed"
capital-q = "crossing"
capital-a = "curly-serifless"
capital-v = "curly-serifless"
capital-w = "curly-asymmetric-serifless"
capital-y = "curly-serifless"
w = "curly-almost-flat-top-serifless"
d = "tailed-serifless"
e = "rounded"
i = "serifed-flat-tailed"
j = "narrow-serifed"
l = "serifed-flat-tailed"
u = "tailed-serifless"
v = "curly-serifless"
y = "curly-turn-serifless"
ampersand = "closed"
at = "fourfold"
f = "narrow-serifless"
t = "narrow-bent-hook"
r = "narrow-hook-serifless"
dollar = "through"
ellipsis-density = "dense"

# Kerberos 1.4.2's drawn (20 pt+) zones, including weight/style differences.
# Snapshot and optical-size targets: sources/caleuche-kerberos.json.
# The static fonts use these zones; the variable fonts follow optical size.
# `descender` is overridable thanks to a one-line patch in
# sources/iosevka/packages/param/src/metric-override.mjs.
[buildPlans.IosevkaCaleuche.metricOverride]
xHeight = 'blend(slopeAngle, [0, blend(weight, [300, 455], [400, 461], [500, 465], [700, 474])], [14.3, blend(weight, [300, 458], [400, 463], [500, 466], [700, 473])])'
cap = 'blend(slopeAngle, [0, blend(weight, [300, 692], [400, 695], [500, 697], [700, 702])], [14.3, blend(weight, [300, 693], [400, 695], [500, 697], [700, 701])])'
ascender = 741
descender = -233
symbolMid = 300                           # keep operators and brackets centred on the lower x-height
periodSize = 'default_periodSize * 0.87'  # period and dots scaled with the x-height
dotSize = 'default_dotSize * 0.9'
onumZeroHeightRatio = 1.10                # oldstyle zero at Kerberos's height
advanceScaleSp = 0.5                      # word space 222 (Kerberos: 212)

# one width: 500 x 461/520, Charon's own width-to-x-height ratio
[buildPlans.IosevkaCaleuche.widths.Normal]
shape = 443
menu = 5
css = "normal"

# Light, Regular, Medium, Bold weights, the same as Charon's
[buildPlans.IosevkaCaleuche.weights.Light]
shape = 300
menu = 300
css  = 300

[buildPlans.IosevkaCaleuche.weights.Regular]
shape = 400
menu = 400
css  = 400

[buildPlans.IosevkaCaleuche.weights.Medium]
shape = 500
menu = 500
css  = 500

[buildPlans.IosevkaCaleuche.weights.Bold]
shape = 700
menu = 700
css  = 700

# Upright and Italic slopes; Kerberos 1.4.2 Italic leans 14.3 degrees
[buildPlans.IosevkaCaleuche.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css  = "normal"

[buildPlans.IosevkaCaleuche.slopes.Italic]
angle = 14.3
shape = "italic"
menu = "italic"
css  = "italic"
