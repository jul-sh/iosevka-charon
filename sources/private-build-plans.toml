# Iosevka Charon (proportional) is drawn to pair with Kerberos
# (https://github.com/jul-sh/Kerberos): Kerberos's vertical zones, a matching
# narrower width, a steeper italic, and weights set by eye against Kerberos.
# Iosevka Charon Mono keeps Iosevka's own proportions.
[buildPlans.IosevkaCharon]
family = "Iosevka Charon"
spacing = "quasi-proportional"
serifs = "sans"
noCvSs = true
exportGlyphNames = true
buildTextureFeature = true
noLigation = false

[buildPlans.IosevkaCharon.ligations]
enables = ["kern-bars", "kern-dotty"]

[buildPlans.IosevkaCharon.variants]
inherits = "ss08"

[buildPlans.IosevkaCharon.variants.design]
two = "straight-neck-serifless"
three = "two-arcs"
five = "oblique-flat-serifless"
six = "open-contour"
eight = "crossing"
nine = "open-contour"
zero = "oval-slashed"
capital-q = "crossing"
capital-a = "curly-serifless"
capital-v = "curly-serifless"
capital-w = "curly-asymmetric-serifless"
capital-y = "curly-serifless"
w = "curly-almost-flat-top-serifless"
d = "tailed-serifless"
e = "rounded"
i = "serifed-flat-tailed"
j = "narrow-serifed"
l = "serifed-flat-tailed"
u = "tailed-serifless"
v = "curly-serifless"
y = "curly-turn-serifless"
ampersand = "closed"
at = "fourfold"
f = "narrow-serifless"
t = "narrow-bent-hook"
r = "narrow-hook-serifless"
dollar = "through"
ellipsis-density = "dense"

# Kerberos's x-height, cap height, ascender and descender (per 1000 em).
# `descender` is overridable thanks to a one-line patch in
# sources/iosevka/packages/param/src/metric-override.mjs.
[buildPlans.IosevkaCharon.metricOverride]
xHeight = 461
cap = 703
ascender = 748
descender = -242
symbolMid = 300                           # keep operators and brackets centred on the lower x-height
periodSize = 'default_periodSize * 0.87'  # period and dots scaled with the x-height
dotSize = 'default_dotSize * 0.9'
onumZeroHeightRatio = 1.10                # oldstyle zero at Kerberos's height
advanceScaleSp = 0.5                      # word space 222 (Kerberos: 212)

# one width: 500 x 461/520, Iosevka's own width-to-x-height ratio
[buildPlans.IosevkaCharon.widths.Normal]
shape = 443
menu = 5
css = "normal"

# Light, Regular, Medium, Bold weights. Regular, Medium and Bold are heavier than
# Iosevka's (475/575/850) to hold their own next to Kerberos at reading sizes.
[buildPlans.IosevkaCharon.weights.Light]
shape = 300
menu = 300
css  = 300

[buildPlans.IosevkaCharon.weights.Regular]
shape = 475
menu = 400
css  = 400

[buildPlans.IosevkaCharon.weights.Medium]
shape = 575
menu = 500
css  = 500

[buildPlans.IosevkaCharon.weights.Bold]
shape = 850
menu = 700
css  = 700

# ONLY Upright and Italic slopes; Kerberos Italic leans ~17 degrees, 15 is Iosevka's maximum
[buildPlans.IosevkaCharon.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css  = "normal"

[buildPlans.IosevkaCharon.slopes.Italic]
angle = 15
shape = "italic"
menu = "italic"
css  = "italic"

# ------------------------------------------

[buildPlans.IosevkaCharonMono]
family = "Iosevka Charon Mono"
spacing = "normal"
serifs = "sans"
noCvSs = true
exportGlyphNames = true
buildTextureFeature = true
noLigation = true

[buildPlans.IosevkaCharonMono.variants]
inherits = "ss08"

[buildPlans.IosevkaCharonMono.variants.design]
two = "straight-neck-serifless"
three = "two-arcs"
five = "oblique-flat-serifless"
six = "open-contour"
eight = "crossing"
nine = "open-contour"
zero = "oval-slashed"
capital-q = "crossing"
capital-a = "curly-serifless"
capital-v = "curly-serifless"
capital-w = "curly-almost-flat-top-serifless"
capital-y = "curly-serifless"
w = "curly-almost-flat-top-serifless"
d = "tailed-serifless"
e = "rounded"
i = "serifed-flat-tailed"
j = "serifed"
l = "serifed-flat-tailed"
u = "tailed-serifless"
v = "curly-serifless"
y = "curly-turn-serifless"
ampersand = "closed"
at = "fourfold"
dollar = "through"

# one width
[buildPlans.IosevkaCharonMono.widths.Normal]
shape = 500
menu = 5
css = "normal"

# Light, Regular, Medium, Bold, Heavy weights
[buildPlans.IosevkaCharonMono.weights.Light]
shape = 300
menu = 300
css  = 300

[buildPlans.IosevkaCharonMono.weights.Regular]
shape = 400
menu = 400
css  = 400

[buildPlans.IosevkaCharonMono.weights.Medium]
shape = 500
menu = 500
css  = 500

[buildPlans.IosevkaCharonMono.weights.Bold]
shape = 700
menu = 700
css  = 700

# ONLY Upright and Italic slopes
[buildPlans.IosevkaCharonMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css  = "normal"

[buildPlans.IosevkaCharonMono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css  = "italic"
